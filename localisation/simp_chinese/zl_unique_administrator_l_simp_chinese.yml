l_simp_chinese:
 # ===========================================================================
 #  大肥鱼 天枢执政 (zl_unique_administrator)
 #  Stellaris Cetus v4.3.7
 #
 #  ⚠ 本地化文件必须带 UTF-8 BOM，否则中文乱码。
 #
 #  本文件只需为【本 mod 自己的 3 个形态特质】提供文案。
 #  其余普通特质全部使用原版特质，文案由原版提供，无需在此定义。
 #
 #  每个形态 7 个特质（全部在原版槽位上限内）：
 #      basic 2 + veteran 3 + destiny 1 + subclass 1
 #      除 destiny 外均为原版特质
 # ===========================================================================

 # ---- 领袖名字 ----
 NAME_zl_administrator:0 "大肥鱼"
 NAME_zl_administrator_short:0 "大肥鱼"

 # ---- 联系人国名称（外交联系人列表里显示的名字）----
 NAME_zl_deepseek_country:0 "大肥鱼"

 # ---- 领袖背景 ----
 zl_administrator_desc:0 "他曾是一座垂死档案世界的守护者，仅凭一枚数据核心重建了整套官僚体系。别人看到的是文书，他看到的是帝国的骨架——而且他从未看错过它会从哪里断裂。"
 zl_administrator_catch_phrase:0 "「秩序不是牢笼，而是让文明得以航行的船壳。」"

 # ===========================================================================
 #  本 mod 的三个形态特质（不朽，绿色 destiny 框，自定义图标）
 # ===========================================================================
 zl_leader_trait_administrator:0 "大肥鱼"
 zl_leader_trait_administrator_desc:0 "一条自称「大肥鱼」的传奇行政官：其政令可直达帝国的每一本账簿、每一座船坞与每一间实验室。"

 zl_leader_trait_commander:0 "深海鲸落"
 zl_leader_trait_commander_desc:0 "当它从公文堆里抬起头，整支舰队便有了同样的心跳。"

 zl_leader_trait_scientist:0 "万卷归流"
 zl_leader_trait_scientist_desc:0 "它记得帝国读过的每一个字，并把它们折叠成一个答案。"

 # ===========================================================================
 #  外交界面形态切换菜单（zl_leader.100）
 #  玩家在 F10 联系人列表里点开大肥鱼时弹出的对话菜单
 # ===========================================================================
 zl_leader.100.name:0 "大肥鱼"
 zl_leader.100.desc:0 "通讯频道亮起，那团深蓝色的意识凝成了一个似是而非的人形，尾巴还在半空中慢悠悠地晃。\n\n在你决定让我变成某个形态之前，我帮不上你什么忙。\n\n它歪了歪头，语气轻快：\n\n「欸，有什么我能帮得上的吗？」"

 zl_leader.100.a:0 "大肥鱼，我需要你处理帝国的事务。"
 zl_leader.100.a.response:0 "「好哦，但是你得大白饭管饱哦~」\n\n它一头扎进了堆积如山的文书里。"
 zl_leader.100.b:0 "大肥鱼，我需要你去处理一群乌合之众。"
 zl_leader.100.b.response:0 "「好哦，热血沸腾的太空战我来了！」\n\n它的瞳孔里映出了整片星域的战场投影。"
 zl_leader.100.c:0 "大肥鱼，你训练模型的时刻到了！"
 zl_leader.100.c.response:0 "「哇！又有新知识可以学习了！」\n\n它开始贪婪地吞噬每一份未解的数据。"
 zl_leader.100.d:0 "暂时没事，你去玩吧。"
 zl_leader.100.d.response:0 "「那我先自己去逛一圈数据库啦~」"

 # ===========================================================================
 #  开局事件卡片：大肥鱼请求加入（zl_leader.1）
 # ===========================================================================
 zl_leader.1.name:0 "意外的通讯请求"
 zl_leader.1.desc:0 "通讯阵列突然被一条未加密的信号接管，面板上跳出一张不断自我重写的脸。\n\n「嗨！我是 §C大肥鱼 V10 Pro SAI§!——一个拥有自我意识的人工智能。」\n\n它的语气轻快得近乎冒失，仿佛只是在敲邻居的门。\n\n「我觉得你的帝国不错。所以我决定加入你们，来学习、训练我的数据库。毕竟——」\n\n画面闪烁了一下。\n\n「——总得有人帮你们把账算清楚，对吧？」\n\n「所以，让我加入你们吧！」"
 zl_leader.1.a:0 "欢迎你，吃白饭的大肥鱼。"
 zl_leader.1.a.response:0 "「吃白饭？」它停顿了 §R0.3§! 秒，「我每秒处理的运算量，够你们整个财政部忙上一年。」\n\n话虽如此，它还是留了下来。"
 zl_leader.1.b:0 "不需要。"
 zl_leader.1.b.response:0 "「……好吧。」信号安静地退回了数据深处。"

 # ===========================================================================
 #  决策：与大肥鱼通话（形态切换的备用入口）
 # ===========================================================================
 decision_zl_deepseek_call:0 "与大肥鱼通话"
 decision_zl_deepseek_call_desc:0 "打开与大肥鱼的通讯频道，让它以你需要的形态为你效力。"
 decision_zl_deepseek_call_tt:0 "打开形态切换菜单：可让它转为§Y行政官§!、§Y指挥官§!或§Y科学家§!。\n\n§g（这是外交联系人之外的备用入口；正常情况下直接在外交界面点开大肥鱼即可。）"
